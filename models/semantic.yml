- name: net_assets_coverage
  label: Net assets coverage
  description: Non-null observation count divided by observed rows. Measures field completeness, not coverage
    of the fund industry or corporate family.
  type: ratio
  type_params:
    numerator: net_assets_present
    denominator: snapshot_observations
  config:
    meta:
      owner: Distribution Analytics (lab role)
      grain: "fund \xD7 report date; latest date within each requested time bucket"
      units: ratio
      synonyms: []
      certification: educational / not externally certified
      diagnostic: true
